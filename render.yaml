# Render Blueprint — the API service, declared in the repo so the settings
# cannot drift or be mistyped in the dashboard.
#
# The build command is the important line: `dist/` is gitignored, so Render
# has to compile TypeScript itself. `--include=dev` is required because
# NODE_ENV=production makes npm skip devDependencies, and TypeScript is one
# of them — without it the build fails with "tsc: not found" and the start
# command then dies looking for dist/server.js that was never written.
services:
  - type: web
    name: lakehead-api
    runtime: node
    rootDir: server
    plan: starter          # not free: free has no disk and sleeps when idle
    region: singapore      # closest to Nepal; put the Atlas cluster here too
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      # THE FALLBACK, not the primary store any more. With the CLOUDINARY_*
      # variables below set, uploads go to Cloudinary and this disk holds only
      # files uploaded before that change. With them unset, this is where
      # everything lands — and if this mount is ever wrong the symptom is
      # silent: the server writes happily to an ordinary folder and loses
      # every byte on the next deploy. GET /api/health reports the resolved
      # path and the file count.
      name: uploads
      mountPath: /opt/render/project/src/server/uploads
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      # Everything below is set in the dashboard, never committed.
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET      # must be 32+ characters or the server exits
        sync: false
      - key: CLIENT_URL      # exact Vercel origin, no trailing slash
        sync: false
      # THESE TWO ARE THE ADMIN ACCOUNT, not a description of one. The
      # server creates it at boot if it is missing and resets the password
      # if this value has changed (see config/ensureAdmin.ts), so changing
      # ADMIN_PASSWORD here and redeploying IS the password reset — there is
      # no reset email and no second account to grant one.
      # ADMIN_EMAIL is also the ONLY address allowed to sign in.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD   # treat as the live credential it is
        sync: false
      # A separate signing key for the footer gate's 10-minute pass.
      # OPTIONAL — unset, it falls back to JWT_SECRET, which is how it
      # shipped and is still safe (a gate token carries no user id, so it
      # cannot authenticate anything). Setting it means one leaked key is one
      # compromise rather than two. 32+ characters.
      - key: GATE_SECRET
        sync: false
      # The code for the hidden door in the site footer. REQUIRED — the
      # server exits at boot without it, which is deliberate: a missing code
      # would otherwise mean an unguarded sign-in page. 12+ characters.
      - key: ADMIN_GATE_CODE
        sync: false
      # The curated Success Stories playlist. Preferred source.
      - key: YOUTUBE_PLAYLIST_ID
        sync: false
      # The channel's uploads. Set this as well as the playlist, not instead
      # of it: YouTube's playlist feed fails intermittently, and this is what
      # the server falls back to when it does. Must start "UC".
      - key: YOUTUBE_CHANNEL_ID
        sync: false
      # The separate playlist behind the Study Abroad testimonial row.
      # Unset, that row renders nothing — it never borrows the channel feed.
      - key: YOUTUBE_TESTIMONIALS_PLAYLIST_ID
        sync: false
      # Cloudinary, for uploaded media. ALL THREE OR NONE — half-set is
      # treated as unset and the server falls back to the disk below.
      # Setting these is what stops uploads being lost on a redeploy; see
      # server/src/services/storage.service.ts for why the disk was not
      # enough on its own.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_PLACE_ID
        sync: false
      # Outgoing mail for inquiry notifications. Every one is optional: with
      # them unset the API boots and runs normally, forms save, and the admin
      # dashboard marks each inquiry "skipped" so it is clear why no mail
      # went out. Declared here so the blueprint knows they exist — the
      # values themselves are typed into the dashboard, never committed.
      # See server/.env.example for what each one wants.
      # MAIL_PASS is a secret: for Google Workspace it is an App Password.
      # Resend is the preferred transport: set RESEND_API_KEY and the SMTP
      # block below is ignored. MAIL_FROM and MAIL_TO are still required
      # either way. See server/.env.example for the setup steps.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT      # 587 (STARTTLS). Never 25 — Render blocks it.
        sync: false
      - key: MAIL_SECURE    # "true" only on port 465; false on 587
        sync: false
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
      - key: MAIL_FROM      # a mailbox on our own domain, not the enquirer's
        sync: false
      - key: MAIL_TO        # comma-separated for several recipients
        sync: false
